body:
  - type: markdown
    attributes:
      value: |
        In a konte workspace, the `konte-feedback` skill can draft a report for you.
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - bug
        - feature
        - docs
        - help
    validations:
      required: true
  - type: checkboxes
    id: area
    attributes:
      label: Area
      options:
        - label: agent
        - label: comfyui
  - type: textarea
    id: body
    attributes:
      label: Report
      description: What you were trying to do, what happened, what you expected, `konte --version` and `uname -sr`; a repro and the output when a command is involved.
    validations:
      required: true
