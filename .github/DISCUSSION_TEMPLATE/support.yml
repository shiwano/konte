body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - bug
        - feature
        - docs
        - help
    validations:
      required: true
  - type: checkboxes
    id: area
    attributes:
      label: Area
      options:
        - label: agent
        - label: comfyui
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Paste the draft from the `konte-feedback` skill, or write what you were trying to do, what happened, what you expected, and the version in your workspace's `konte.version`; a repro and the output when a command is involved.
    validations:
      required: true
