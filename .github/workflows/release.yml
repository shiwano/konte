  #     # Developer ID codesign (hardened runtime) + notarytool + stapler with
  #     # secrets: APPLE_CERT_P12, APPLE_CERT_PASSWORD, APPLE_ID, APPLE_TEAM_ID,
  #     # APPLE_APP_PASSWORD.
  #     - name: Sign and notarize
  #       run: 'echo "TODO: codesign + notarytool on out/konte-darwin-{x64,arm64}"'
  #
  #     - uses: actions/upload-artifact@v7
  #       with:
  #         name: konte-darwin-x64
  #         path: out/konte-darwin-x64
  #         overwrite: true
  #     - uses: actions/upload-artifact@v7
