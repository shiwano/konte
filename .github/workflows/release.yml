  #     - name: Sign (Trusted Signing)
  #       run: 'echo "TODO: azure/trusted-signing-action on out/konte-windows-x64.exe"'
  #
  #     - uses: actions/upload-artifact@v7
  #       with:
  #         name: konte-windows-x64
