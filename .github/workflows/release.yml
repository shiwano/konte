  release:
    needs: build
    # needs: [build, sign-windows, sign-macos]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: konte-*
          path: dist-assets
          merge-multiple: true

      - name: Checksums
        working-directory: dist-assets
        run: sha256sum konte-* > SHA256SUMS

      # Create as draft and flip to published only after every asset is up, so
      # `releases/latest/download/...` never resolves to a half-uploaded release.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --draft \
            dist-assets/*
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --draft=false
