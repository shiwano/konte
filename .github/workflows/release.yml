  release:
    needs: build
    # needs: [build, sign-windows, sign-macos]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: konte-*
          path: dist-assets
          merge-multiple: true

      - name: Checksums
        working-directory: dist-assets
        run: sha256sum konte-* > SHA256SUMS

      # --generate-notes lists pull requests only, and most commits reach main without one. The
      # notes hold the commits that touch what ships.
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          range="$TAG"
          if previous=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null); then
            range="$previous..$TAG"
          fi
          git log --format='- %s (%h)' --invert-grep --grep='^🎬' "$range" -- \
            src plugin setup.sh setup.ps1 package.json bun.lock \
            ':(exclude,glob)src/**/__tests__/**' > notes.md
          if [ -n "${previous:-}" ]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$REPO" "$previous" "$TAG" >> notes.md
          fi

      # Create as draft and flip to published only after every asset is up, so
      # `releases/latest/download/...` never resolves to a half-uploaded release.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$TAG" \
            --notes-file notes.md \
            --draft \
            dist-assets/*
          gh release edit "$TAG" \
            --repo "$REPO" \
            --draft=false
