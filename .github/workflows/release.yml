name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Every `run` step below executes in the flake's CI shell, so the release is built and
    # tested with the same pinned bun and ffmpeg the dev shell hands a developer. The suite
    # resolves ffmpeg/ffprobe off PATH (vitest.setup.ts) and the runner image ships neither.
    defaults:
      run:
        shell: nix develop .#ci --command bash -e {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: bun install --frozen-lockfile

      # `konte --version` and the update check read package.json, so a tag that
      # disagrees with it would ship a binary that reports itself outdated forever.
      - name: Check tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          pkg="v$(jq -r .version package.json)"
          [ "$pkg" = "${{ github.ref_name }}" ] || {
            echo "tag ${{ github.ref_name }} does not match package.json version $pkg" >&2
            exit 1
          }

      # Everything the compiled binary embeds, run once — `build` without its final
      # compile step, which runs once per target below.
      - name: Prepare embeds
        run: |
          bun run build:embeds
          bun run typecheck

      - name: Test
        run: bun run test:run

      - name: Compile all targets
        run: |
          set -euo pipefail
          mkdir -p out
          compile() {
            KONTE_COMPILE_TARGET="$1" KONTE_COMPILE_OUTFILE="out/$2" \
              bun run scripts/compile-binary.ts
          }
          compile bun-linux-x64-baseline    konte-linux-x64
          compile bun-linux-arm64           konte-linux-arm64
          compile bun-darwin-x64-baseline   konte-darwin-x64
          compile bun-darwin-arm64          konte-darwin-arm64
          compile bun-windows-x64-baseline  konte-windows-x64.exe

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: konte-linux-x64
          path: out/konte-linux-x64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: konte-linux-arm64
          path: out/konte-linux-arm64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: konte-darwin-x64
          path: out/konte-darwin-x64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: konte-darwin-arm64
          path: out/konte-darwin-arm64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: konte-windows-x64
          path: out/konte-windows-x64.exe

