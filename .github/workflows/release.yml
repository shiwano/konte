name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Every `run` step below executes in the flake's dev shell, so the release is built and
    # tested with the same pinned bun and ffmpeg a developer gets. The suite resolves
    # ffmpeg/ffprobe off PATH (vitest.setup.ts) and the runner image ships neither.
    defaults:
      run:
        shell: nix develop --command bash -e {0}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31.11.1
      - run: bun install --frozen-lockfile

      - name: Check tag is on main
        if: github.ref_type == 'tag'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "tag $GITHUB_REF_NAME is not on main" >&2
            exit 1
          }

      # `konte --version` and the update check read package.json, so a tag that
      # disagrees with it would ship a binary that reports itself outdated forever.
      - name: Check tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          pkg="v$(jq -r .version package.json)"
          [ "$pkg" = "$GITHUB_REF_NAME" ] || {
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          }

      # Everything the compiled binary embeds, run once — `build` without its final
      # compile step, which runs once per target below.
      - name: Prepare embeds
        run: |
          bun run build:embeds
          bun run check
          git diff --exit-code

      - name: Test
        run: bun run test:run

      - name: Compile all targets
        run: |
          set -euo pipefail
          mkdir -p out
          compile() {
            KONTE_COMPILE_TARGET="$1" KONTE_COMPILE_OUTFILE="out/$2" \
              bun run scripts/compile-binary.ts --release
          }
          compile bun-linux-x64-baseline    konte-linux-x64
          compile bun-linux-arm64           konte-linux-arm64
          compile bun-darwin-x64-baseline   konte-darwin-x64
          compile bun-darwin-arm64          konte-darwin-arm64
          compile bun-windows-x64-baseline  konte-windows-x64.exe

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: konte-linux-x64
          path: out/konte-linux-x64
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: konte-linux-arm64
          path: out/konte-linux-arm64
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: konte-darwin-x64
          path: out/konte-darwin-x64
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: konte-darwin-arm64
          path: out/konte-darwin-arm64
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: konte-windows-x64
          path: out/konte-windows-x64.exe

  # TODO(signing): uncomment once the signing secrets exist, along with the
  # release job's `needs`. Until then the darwin binaries ship with the ad-hoc
