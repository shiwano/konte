name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop .#ci --command bash -e {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: bun install --frozen-lockfile

      # src/core/generated/ is gitignored, and typecheck reads it.
      - run: bun run build:embeds

      - run: bun run check

  test:
    runs-on: ubuntu-latest
    # The suite drives the real ffmpeg pipeline off PATH (vitest.setup.ts); the flake's CI
    # shell is where that ffmpeg and bun come from, pinned by flake.lock.
    defaults:
      run:
        shell: nix develop .#ci --command bash -e {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: bun install --frozen-lockfile

      # src/core/generated/ is gitignored, and the CLI the suite spawns imports it.
      - run: bun run build:embeds

      - run: bun run test:run
