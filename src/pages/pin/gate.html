<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>konte review</title>
  <style>
    /* The review's own palette and radii, restated: this page is served before any of
       src/pages/preview/styles/index.css is reachable. */
    :root {
      --bg-app: #0b0c0f;
      --bg-panel: #141519;
      --bg-input: #0f1014;
      --border: #23252d;
      --border-strong: #2e323c;
      --text-primary: #e7e9ee;
      --text-secondary: #9aa0ac;
      --text-muted: #686f7d;
      --accent: #6e62f5;
      --accent-hover: #8378ff;
      --accent-soft: rgba(110, 98, 245, 0.15);
      --red: #f25c5c;
      --radius-md: 10px;
      --radius-lg: 14px;
      --font:
        "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial,
        sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font: 16px var(--font);
      background: var(--bg-app);
      color: var(--text-primary);
      display: grid;
      place-items: center;
      min-height: 100dvh;
      padding: 24px;
    }

    form {
      width: 100%;
      max-width: 320px;
      display: grid;
      gap: 14px;
      justify-items: stretch;
      padding: 24px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }

    .brand {
      justify-self: center;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    label {
      justify-self: center;
      text-align: center;
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--text-secondary);
    }

    /* `text-indent` gives back the tracking that trails the fourth digit, which centring would
       otherwise count as ink. Width in `ch` does not work here: it measures the glyphs alone and
       drops the four letter-spacings. */
    input {
      width: 100%;
      padding: 12px 16px;
      font: inherit;
      font-size: 30px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.42em;
      text-indent: 0.42em;
      text-align: center;
      color: inherit;
      background: var(--bg-input);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    button {
      min-height: 44px;
      padding: 0 22px;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), #8d5cf5);
      border: 0;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: filter 0.15s;
    }

    button:hover {
      filter: brightness(1.08);
    }

    .error {
      text-align: center;
      font-size: 0.85rem;
      color: var(--red);
    }

    /* Nothing refused yet: no message, and no gap where one would go. */
    .error:empty {
      display: none;
    }
  </style>
  <form method="post" action="{{action}}">
    <span class="brand">konte</span>
    <!-- The hand-off is all this page can name: it knows neither where konte preview ran nor who
         read its output. -->
    <label for="pin">Enter the PIN you were given with this link</label>
    <input
      id="pin"
      name="pin"
      inputmode="numeric"
      pattern="[0-9]{4}"
      maxlength="4"
      autocomplete="off"
      autofocus
      required
    />
    <input type="hidden" name="next" value="{{next}}" />
    <button type="submit">Open review</button>
    <p class="error" role="alert">{{error}}</p>
  </form>
</html>
