<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>konte review</title>
  <style>
    /* The gate's palette, for the page the gate closes on. */
    :root {
      --bg-app: #0b0c0f;
      --bg-panel: #141519;
      --bg-elevated: #1a1c22;
      --border: #23252d;
      --text-primary: #e7e9ee;
      --text-secondary: #9aa0ac;
      --red: #f25c5c;
      --radius-md: 10px;
      --radius-lg: 14px;
      --font:
        "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial,
        sans-serif;
      --font-mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font: 16px var(--font);
      background: var(--bg-app);
      color: var(--text-primary);
      display: grid;
      place-items: center;
      min-height: 100dvh;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 360px;
      display: grid;
      gap: 10px;
      justify-items: center;
      padding: 24px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      text-align: center;
    }

    .brand {
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--red);
    }

    p {
      font-size: 0.85rem;
      line-height: 1.6;
      color: var(--text-secondary);
    }

    code {
      padding: 2px 6px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-primary);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
    }
  </style>
  <div class="card">
    <span class="brand">konte</span>
    <span class="title">Too many wrong PINs</span>
    <p>This review is closed to the network. Restart <code>konte preview</code>.</p>
  </div>
</html>
