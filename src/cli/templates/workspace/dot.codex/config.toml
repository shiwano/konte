model_context_window = 1000000
model_auto_compact_token_limit = 750000

default_permissions = "konte"
approval_policy = "on-request"
approvals_reviewer = "auto_review"

[permissions.konte]
extends = ":workspace"

[permissions.konte.filesystem.":workspace_roots"]
".claude/settings.json" = "read"
".codex/config.toml" = "read"

[permissions.konte.network]
enabled = true
allow_local_binding = true

[features]
unified_exec = true

[shell_environment_policy.set]

[mcp_servers.konte]
command = "konte"
args = ["mcp", "serve"]
